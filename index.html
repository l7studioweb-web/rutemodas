<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rute Modas | Boutique Premium Bauru</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* DESIGN PREMIUM EDITORIAL */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #0A0A0A; -webkit-font-smoothing: antialiased; }
        .font-serif { font-family: 'Playfair Display', serif; }
        
        /* HEADER */
        header { position: fixed; top: 0; left: 0; w-full: 100%; width: 100%; background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); z-index: 50; border-b: 1px solid rgba(0,0,0,0.06); padding: 20px 24px; }
        .header-container { max-w: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 18px; font-weight: 600; tracking-key: 0.2em; letter-spacing: 0.2em; text-decoration: none; color: #0A0A0A; }
        .nav-desktop { display: none; }
        @media (min-width: 768px) { .nav-desktop { display: flex; gap: 32px; } }
        .nav-desktop a { text-decoration: none; color: rgba(0,0,0,0.6); font-size: 11px; uppercase: text; text-transform: uppercase; letter-spacing: 0.15em; transition: color 0.3s; }
        .nav-desktop a:hover { color: #000; }
        .btn-whatsapp-header { display: none; border: 1px solid #0A0A0A; padding: 10px 20px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em; text-decoration: none; color: #0A0A0A; font-weight: 500; transition: all 0.3s; }
        @media (min-width: 768px) { .btn-whatsapp-header { display: block; } }
        .btn-whatsapp-header:hover { background-color: #0A0A0A; color: #fff; }
        
        /* HERO SECTION */
        .hero { min-height: 90vh; padding-top: 100px; background-color: #F5F5F7; display: flex; align-items: center; overflow: hidden; }
        .hero-container { max-w: 1200px; margin: 0 auto; padding: 40px 24px; display: grid; grid-template-columns: 1fr; gap: 40px; width: 100%; align-items: center; }
        @media (min-width: 768px) { .hero-container { grid-template-columns: 1fr 1fr; } }
        .hero-text { order: 2; }
        @media (min-width: 768px) { .hero-text { order: 1; } }
        .hero-tag { font-size: 11px; text-transform: uppercase; letter-spacing: 0.3em; color: rgba(0,0,0,0.4); margin-bottom: 16px; display: block; }
        .hero-title { font-size: 38px; line-height: 1.2; color: #0A0A0A; margin-bottom: 24px; font-weight: 400; }
        @media (min-width: 768px) { .hero-title { font-size: 56px; } }
        .hero-subtitle { color: rgba(0,0,0,0.6); font-weight: 300; font-size: 15px; max-width: 400px; margin-bottom: 32px; line-height: 1.6; }
        .hero-cta { inline-flex: display; display: inline-flex; align-items: center; text-decoration: none; font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; color: #0A0A0A; font-weight: 500; border-b: 1px solid #0A0A0A; padding-bottom: 4px; transition: gap 0.3s; }
        .hero-image-box { order: 1; height: 320px; width: 100%; overflow: hidden; background-color: #e4e4e7; }
        @media (min-width: 768px) { .hero-image-box { order: 2; height: 65vh; } }
        .hero-img { w-full: 100%; width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); }

        /* SEÇÃO CATEGORIAS */
        .categorias { padding: 80px 24px; max-width: 1200px; margin: 0 auto; }
        .sec-tag { font-size: 11px; text-transform: uppercase; letter-spacing: 0.3em; color: rgba(0,0,0,0.4); margin-bottom: 8px; display: block; }
        .sec-title { font-size: 28px; color: #0A0A0A; margin-bottom: 48px; font-weight: 400; }
        .grid-categorias { display: grid; grid-template-columns: 1fr; gap: 48px; }
        @media (min-width: 768px) { .grid-categorias { grid-template-columns: 1fr 1fr; gap: 60px; } }
        .cat-item { text-decoration: none; color: #0A0A0A; display: block; }
        .cat-img-box { width: 100%; height: 380px; overflow: hidden; background-color: #f4f4f5; margin-bottom: 16px; }
        .cat-img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); transition: transform 0.5s; }
        .cat-item:hover .cat-img { transform: scale(1.03); }
        .cat-name { font-size: 18px; font-weight: 400; }

        /* SEÇÃO SOBRE (FUNDO PRETO) */
        .sobre { background-color: #0A0A0A; color: #ffffff; padding: 100px 24px; text-align: center; }
        .sobre-container { max-w: 700px; margin: 0 auto; }
        .sobre-tag { font-size: 11px; text-transform: uppercase; letter-spacing: 0.4em; color: rgba(255,255,255,0.4); margin-bottom: 24px; display: block; }
        .sobre-title { font-size: 28px; margin-bottom: 32px; font-weight: 400; }
        .sobre-text { font-size: 18px; color: rgba(255,255,255,0.85); line-height: 1.8; font-style: italic; font-weight: 300; }

        /* SEÇÃO CONTATO */
        .contato { padding: 100px 24px; text-align: center; background-color: #F5F5F7; }
        .contato-container { max-width: 600px; margin: 0 auto; }
        .contato-title { font-size: 32px; margin-bottom: 16px; font-weight: 400; }
        .contato-subtitle { color: rgba(0,0,0,0.5); font-size: 14px; margin-bottom: 40px; font-weight: 300; }
        .contato-buttons { display: flex; flex-direction: column; gap: 16px; justify-content: center; align-items: center; }
        @media (min-width: 576px) { .contato-buttons { flex-direction: row; } }
        .btn-primary { background-color: #0A0A0A; color: #fff; padding: 18px 36px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; font-weight: 500; text-decoration: none; width: 100%; text-align: center; }
        @media (min-width: 576px) { .btn-primary { width: auto; } }
        .btn-primary:hover { background-color: #222; }
        .btn-secondary { border: 1px solid rgba(0,0,0,0.2); color: #0A0A0A; padding: 18px 36px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; font-weight: 500; text-decoration: none; width: 100%; text-align: center; transition: border 0.3s; }
        @media (min-width: 576px) { .btn-secondary { width: auto; } }
        .btn-secondary:hover { border-color: #0A0A0A; }

        /* FOOTER */
        footer { border-t: 1px solid rgba(0,0,0,0.06); border-top: 1px solid rgba(0,0,0,0.06); padding: 48px 24px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em; color: rgba(0,0,0,0.4); background-color: #fff; }
        .footer-container { max-w: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; justify-content: space-between; align-items: center; }
        @media (min-width: 768px) { .footer-container { flex-direction: row; } }
        .footer-brand { text-align: center; }
        @media (min-width: 768px) { .footer-brand { text-align: left; } }
        .footer-logo { color: #0A0A0A; font-weight: 600; display: block; margin-bottom: 4px; }
        .footer-links { display: flex; gap: 24px; }
        .footer-links a { text-decoration: none; color: rgba(0,0,0,0.4); transition: color 0.3s; }
        .footer-links a:hover { color: #0A0A0A; }
    </style>
</head>
<body>

    <!-- 1. HEADER -->
    <header>
        <div class="header-container">
            <a href="#inicio" class="logo font-serif">RUTE MODAS</a>
            <nav class="nav-desktop">
                <a href="#inicio">Início</a>
                <a href="#colecao">Coleção</a>
                <a href="#sobre">Sobre</a>
                <a href="#contato">Contato</a>
            </nav>
            <a href="https://wa.me" target="_blank" class="btn-whatsapp-header">Falar no WhatsApp</a>
        </div>
    </header>

    <!-- 2. HERO SECTION -->
    <section id="inicio" class="hero">
        <div class="hero-container">
            <div class="hero-text">
                <span class="hero-tag">Boutique Autoral</span>
                <h1 class="hero-title font-serif">Moda que define seu estilo.</h1>
                <p class="hero-subtitle">Moda feminina, beleza e acessórios para completar o seu estilo.</p>
                <a href="#colecao" class="hero-cta">Explorar coleção →</a>
            </div>
            <div class="hero-image-box">
                <img src="https://unsplash.com" alt="Editorial Rute Modas" class="hero-img">
            </div>
        </div>
    </section>

    <!-- 3. CATEGORIAS & PRODUTOS -->
    <section id="colecao" class="categorias">
        <span class="sec-tag">Categorias</span>
        <h2 class="sec-title font-serif">A Seleção</h2>

        <div class="grid-categorias">
            <div class="cat-item">
                <div class="cat-img-box">
                    <img src="https://unsplash.com" alt="Moda Feminina" class="cat-img">
                </div>
                <h3 class="cat-name font-serif">Moda Feminina</h3>
            </div>
            <div class="cat-item">
                <div class="cat-img-box">
                    <img src="https://unsplash.com" alt="Perfumes" class="cat-img">
                </div>
                <h3 class="cat-name font-serif">Perfumes</h3>
            </div>
            <div class="cat-item">
                <div class="cat-img-box">
                    <img src="https://unsplash.com" alt="Cosméticos" class="cat-img">
                </div>
